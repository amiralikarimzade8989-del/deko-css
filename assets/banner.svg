 <stop offset="1" stop-color="#f59e0b"><animate attributeName="stop-color" values="#f59e0b;#22d3ee;#a78bfa;#d946ef;#f59e0b" dur="8s" repeatCount="indefinite"/></stop>
</linearGradient>
